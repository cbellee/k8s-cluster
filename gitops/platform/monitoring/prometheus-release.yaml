apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    serverFiles:
      recording_rules.yml:
        groups:
          - name: coredns-dashboard-compatibility
            rules:
              - record: coredns_forward_requests_total
                expr: sum without (rcode, proxy_name) (coredns_proxy_request_duration_seconds_count{job="coredns", proxy_name="forward"})
              - record: coredns_forward_responses_total
                expr: sum without (proxy_name) (coredns_proxy_request_duration_seconds_count{job="coredns", proxy_name="forward"})
    scrapeConfigs:
      kubernetes-api-servers:
        job_name: apiserver
      kubernetes-service-endpoints:
        post_relabel_configs: |
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            regex: kube-system;kube-dns
            target_label: job
            replacement: coredns
      kubernetes-nodes:
        post_relabel_configs: |
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
      kubernetes-nodes-cadvisor:
        post_relabel_configs: |
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
    alertmanager:
      enabled: false
    server:
      service:
        type: ClusterIP
      persistentVolume:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
