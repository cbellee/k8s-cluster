apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-gateway
  namespace: monitoring
spec:
  secretName: grafana-gateway-tls
  dnsNames:
    - grafana.internal.bellee.net
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: monitoring
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      bgp: public
  listeners:
    - name: http
      hostname: grafana.internal.bellee.net
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: grafana.internal.bellee.net
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    dns.mikrotik/enabled: "true"
    dns.mikrotik/comment: "Grafana monitoring dashboard"
spec:
  parentRefs:
    - name: grafana-gateway
      sectionName: https
  hostnames:
    - grafana.internal.bellee.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: grafana-gateway
      sectionName: http
  hostnames:
    - grafana.internal.bellee.net
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
