apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    service:
      type: ClusterIP
    grafana.ini:
      server:
        domain: grafana.internal.bellee.net
        root_url: https://grafana.internal.bellee.net
      security:
        cookie_secure: true
    persistence:
      enabled: false
    testFramework:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus-server.monitoring.svc.cluster.local
            isDefault: true
            jsonData:
              timeInterval: 1m
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: false
            options:
              path: /var/lib/grafana/dashboards/kubernetes
    dashboards:
      kubernetes:
        global:
          gnetId: 15757
          datasource: Prometheus
        namespaces:
          gnetId: 15758
          datasource: Prometheus
        nodes:
          gnetId: 15759
          datasource: Prometheus
        pods:
          gnetId: 15760
          datasource: Prometheus
        api-server:
          gnetId: 15761
          datasource: Prometheus
        coredns:
          gnetId: 15762
          datasource: Prometheus
        prometheus:
          gnetId: 19105
          datasource: Prometheus
